name: Arm SDK compatibility
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create environment
        run: uv venv --python ${{ matrix.python }}
      - name: Install reviewed transport source
        env:
          # The Gitea instance requires login even for public repositories.
          # A read-only token can override the job token on restricted runners.
          TRANSPORT_READ_TOKEN: ${{ secrets.TRANSPORT_READ_TOKEN || github.token }}
          GITEA_URL: ${{ github.server_url }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: token $TRANSPORT_READ_TOKEN" \
            "$GITEA_URL/api/v1/repos/zhuzhixiang/linkerbot-transport/archive/83d105fcb60703bab89fdf4e99b02f99225d344c.tar.gz" \
            --output /tmp/linkerbot-transport.tar.gz
          uv pip install /tmp/linkerbot-transport.tar.gz
      - name: Install minimum base dependencies (Python 3.10)
        if: matrix.python == '3.10'
        run: uv pip install -e '.[test,dev]' 'numpy==1.24.0' 'scipy==1.10.0' 'pydantic==2.0' 'python-can==4.6.1'
      - name: Install full kinematics (Python 3.12)
        if: matrix.python == '3.12'
        run: uv pip install -e '.[kinetix,test,dev]'
      - name: Test
        run: .venv/bin/python -m pytest
      - name: Lint
        run: .venv/bin/ruff check src tests tools
      - name: Build distribution
        run: uv build
      - name: Test installed wheel outside source tree
        run: |
          uv pip uninstall linkerbot-arm
          uv pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests"
